
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAYO STRIKE 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;color:white;font-family:Arial}
#game{position:fixed;inset:0}
#hud{
 position:fixed;top:15px;left:15px;z-index:5;
 background:#081522cc;padding:12px 16px;
 border-radius:12px;line-height:1.8;font-weight:bold
}
#crosshair{
 position:fixed;left:50%;top:50%;
 transform:translate(-50%,-50%);
 color:#fff;font-size:32px;pointer-events:none;
 text-shadow:0 0 4px black;z-index:4
}
#menu{
 position:fixed;inset:0;background:#07121eea;
 z-index:10;display:flex;align-items:center;
 justify-content:center;flex-direction:column;
 text-align:center;padding:20px
}
#menu h1{font-size:36px;color:#f0c34d}
button{
 border:0;border-radius:10px;padding:14px 20px;
 background:#2379d5;color:white;font-weight:bold;
 font-size:16px;cursor:pointer;touch-action:none;
 user-select:none
}
#start{background:#e0aa25;color:#101820;font-size:20px}
#notice{
 position:fixed;top:15px;left:50%;
 transform:translateX(-50%);z-index:5;
 font-weight:bold;color:#ffe36b;text-align:center
}
#mobile{
 position:fixed;bottom:20px;left:0;width:100%;
 display:flex;justify-content:space-between;
 padding:0 20px;z-index:6;pointer-events:none
}
#mobile>*{pointer-events:auto}
#joystick{
 width:135px;height:135px;border:2px solid #ffffff77;
 border-radius:50%;background:#ffffff22;
 position:relative;touch-action:none
}
#stick{
 width:55px;height:55px;border-radius:50%;
 background:#ffffffaa;position:absolute;
 left:50%;top:50%;transform:translate(-50%,-50%)
}
#fire{
 width:90px;height:90px;border-radius:50%;
 background:#df3847
}
#reload{background:#426080}
#buttons{display:flex;align-items:end;gap:10px}
#damage{
 position:fixed;inset:0;background:#ff0000;
 opacity:0;pointer-events:none;z-index:3
}
#hint{
 position:fixed;bottom:10px;left:50%;
 transform:translateX(-50%);color:#d0d9e2;
 font-size:12px;z-index:4;white-space:nowrap
}
@media(max-width:600px){
 #hud{font-size:12px;padding:8px}
 #joystick{width:115px;height:115px}
 #fire{width:75px;height:75px}
 #buttons{gap:5px}
 #buttons button{font-size:12px;padding:12px}
 #hint{display:none}
}
</style>
</head>
<body>

<div id="game"></div>
<div id="damage"></div>
<div id="crosshair">+</div>

<div id="hud">
 ❤️ HP: <span id="hp">100</span><br>
 🔫 AMMO: <span id="ammo">30</span> / <span id="reserve">120</span><br>
 🎯 KILLS: <span id="kills">0</span><br>
 🌊 WAVE: <span id="wave">1</span>
</div>

<div id="notice"></div>

<div id="menu">
 <h1>🎯 VAYO STRIKE 3D</h1>
 <p>FPS — 3D Shooting Game</p>
 <p>WASD — ҳаракат | Mouse — нигоҳ кардан<br>
 Click — тирпарронӣ | R — пур кардани тир</p>
 <button id="start">▶ START GAME</button>
</div>

<div id="mobile">
 <div id="joystick"><div id="stick"></div></div>
 <div id="buttons">
  <button id="reload">RELOAD</button>
  <button id="fire">🔥 FIRE</button>
 </div>
</div>

<div id="hint">Компютер: барои идора кардани камера ба майдон клик кун</div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x90b4c8);
scene.fog=new THREE.Fog(0x90b4c8,35,95);

const camera=new THREE.PerspectiveCamera(
 75,innerWidth/innerHeight,.1,200
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
$("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x506070,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(20,40,15);
sun.castShadow=true;
scene.add(sun);

const material=c=>new THREE.MeshStandardMaterial({color:c});

function cube(w,h,d,c,x,y,z){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),material(c)
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}

/* MAP */

cube(100,1,100,0x777b73,0,-.5,0);

const walls=[];
function wall(w,h,d,x,y,z,c=0xb9a88b){
 const m=cube(w,h,d,c,x,y,z);
 walls.push(m);
 return m;
}

wall(100,10,2,0,5,-50);
wall(100,10,2,0,5,50);
wall(2,10,100,-50,5,0);
wall(2,10,100,50,5,0);

wall(20,7,3,-20,3.5,-15);
wall(3,7,20,15,3.5,-15);
wall(18,7,3,20,3.5,20);
wall(3,7,15,-20,3.5,20);

for(let i=0;i<18;i++){
 const x=(Math.random()-.5)*75;
 const z=(Math.random()-.5)*75;
 if(Math.hypot(x,z)<13)continue;
 wall(3,2.5,3,x,1.25,z,0x826b50);
}

/* PLAYER */

camera.position.set(0,1.7,10);
let yaw=0,pitch=0;
let hp=100,ammo=30,reserve=120,kills=0,wave=1;
let playing=false;
let fireCooldown=0;
let reloading=false;
let reloadTime=0;
let damageFlash=0;

const keys={};
const joy={x:0,y:0};
const enemies=[];
const raycaster=new THREE.Raycaster();

const gun=new THREE.Group();
camera.add(gun);
scene.add(camera);

function gunPart(w,h,d,c,x,y,z){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),material(c)
 );
 m.position.set(x,y,z);
 gun.add(m);
}
gunPart(.22,.25,1.1,0x232b31,.35,-.3,-.65);
gunPart(.15,.2,.55,0x111111,.35,-.46,-.35);
gunPart(.1,.1,.4,0x4e5961,.35,-.19,-1.05);

/* ENEMIES */

function spawnEnemy(){
 const group=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.CylinderGeometry(.55,.5,1.4,10),
  material(0xb63236)
 );
 body.position.y=1.3;
 group.add(body);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.38,12,10),
  material(0xd7a17e)
 );
 head.position.y=2.3;
 group.add(head);

 const legMaterial=material(0x29323b);
 for(const x of [-.25,.25]){
  const leg=new THREE.Mesh(
   new THREE.BoxGeometry(.25,.9,.3),legMaterial
  );
  leg.position.set(x,.45,0);
  group.add(leg);
 }

 let x,z;
 do{
  x=(Math.random()-.5)*85;
  z=(Math.random()-.5)*85;
 }while(Math.hypot(x-camera.position.x,z-camera.position.z)<18);

 group.position.set(x,0,z);
 scene.add(group);

 const enemy={
  group,hp:100,speed:2.5+wave*.25,
  attackCooldown:0
 };
 group.traverse(obj=>{
  if(obj.isMesh)obj.userData.enemy=enemy;
 });
 enemies.push(enemy);
}

function spawnWave(){
 for(let i=0;i<Math.min(3+wave,14);i++)
  spawnEnemy();
 $("wave").textContent=wave;
 showNotice("WAVE "+wave);
}

function showNotice(t){
 $("notice").textContent=t;
 setTimeout(()=>{
  if($("notice").textContent===t)
   $("notice").textContent="";
 },1400);
}

function updateHud(){
 $("hp").textContent=Math.max(0,Math.ceil(hp));
 $("ammo").textContent=ammo;
 $("reserve").textContent=reserve;
 $("kills").textContent=kills;
 $("wave").textContent=wave;
}

/* SHOOTING */

function shoot(){
 if(!playing||reloading||fireCooldown>0)return;

 if(ammo<=0){
  reload();
  return;
 }

 ammo--;
 fireCooldown=.14;
 gun.position.z=.13;
 gun.rotation.x=.1;

 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);

 const targets=[
  ...walls,
  ...enemies.flatMap(e=>{
   const arr=[];
   e.group.traverse(o=>{
    if(o.isMesh)arr.push(o);
   });
   return arr;
  })
 ];

 const hits=raycaster.intersectObjects(targets,false);

 if(hits.length){
  const hit=hits[0];
  const enemy=hit.object.userData.enemy;

  if(enemy){
   const headshot=hit.object.position.y>2;
   enemy.hp-=headshot?100:40;

   if(enemy.hp<=0){
    scene.remove(enemy.group);
    enemies.splice(enemies.indexOf(enemy),1);
    kills++;
    showNotice(headshot?"HEADSHOT!":"ENEMY DOWN!");

    if(enemies.length===0){
     wave++;
     spawnWave();
    }
   }
  }
 }
 updateHud();
}

function reload(){
 if(!playing||reloading||ammo===30||reserve<=0)return;
 reloading=true;
 reloadTime=1.5;
 showNotice("RELOADING...");
}

function finishReload(){
 const amount=Math.min(30-ammo,reserve);
 ammo+=amount;
 reserve-=amount;
 reloading=false;
 updateHud();
}

/* MOVEMENT */

function collision(x,z){
 if(Math.abs(x)>48||Math.abs(z)>48)return true;

 const p=new THREE.Vector3(x,1.5,z);
 for(const w of walls){
  const b=new THREE.Box3().setFromObject(w);
  b.expandByScalar(.45);
  if(b.containsPoint(p))return true;
 }
 return false;
}

function updatePlayer(dt){
 let forward=0,side=0;

 if(keys.w||keys.arrowup)forward++;
 if(keys.s||keys.arrowdown)forward--;
 if(keys.a||keys.arrowleft)side--;
 if(keys.d||keys.arrowright)side++;

 forward-=joy.y;
 side+=joy.x;

 const len=Math.hypot(forward,side);
 if(len>1){
  forward/=len;
  side/=len;
 }

 const speed=8;
 const dx=(-Math.sin(yaw)*forward+
           Math.cos(yaw)*side)*speed*dt;
 const dz=(-Math.cos(yaw)*forward-
           Math.sin(yaw)*side)*speed*dt;

 if(!collision(camera.position.x+dx,camera.position.z))
  camera.position.x+=dx;

 if(!collision(camera.position.x,camera.position.z+dz))
  camera.position.z+=dz;

 camera.rotation.order="YXZ";
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
}

/* ENEMY AI */

function updateEnemies(dt){
 for(const e of enemies){
  const dx=camera.position.x-e.group.position.x;
  const dz=camera.position.z-e.group.position.z;
  const d=Math.hypot(dx,dz);

  e.group.rotation.y=Math.atan2(dx,dz);
  e.attackCooldown-=dt;

  if(d>2&&d<38){
   const nx=e.group.position.x+dx/d*e.speed*dt;
   const nz=e.group.position.z+dz/d*e.speed*dt;
   if(!collision(nx,nz)){
    e.group.position.x=nx;
    e.group.position.z=nz;
   }
  }

  if(d<2.3&&e.attackCooldown<=0){
   hp-=10;
   damageFlash=.4;
   e.attackCooldown=1;
   updateHud();

   if(hp<=0)gameOver();
  }
 }
}

function gameOver(){
 playing=false;
 document.exitPointerLock?.();
 $("menu").style.display="flex";
 $("menu").querySelector("h1").textContent="GAME OVER";
 $("menu").querySelector("p").textContent=
  "KILLS: "+kills+" | WAVE: "+wave;
 $("start").textContent="▶ PLAY AGAIN";
}

/* CONTROLS */

document.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 keys[k]=true;
 if([" ","arrowup","arrowdown","arrowleft","arrowright"]
  .includes(k))e.preventDefault();

 if(k==="r")reload();
 if(k===" "&&!e.repeat)shoot();
});

document.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement!==renderer.domElement)return;
 yaw-=e.movementX*.0025;
 pitch-=e.movementY*.0025;
 pitch=THREE.MathUtils.clamp(pitch,-1.3,1.3);
});

renderer.domElement.addEventListener("click",()=>{
 if(!playing)return;
 if(matchMedia("(pointer:fine)").matches){
  if(document.pointerLockElement===renderer.domElement)
   shoot();
  else renderer.domElement.requestPointerLock();
 }
});

const joystick=$("joystick");
const stick=$("stick");

function joystickMove(e){
 const r=joystick.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 const max=r.width*.34;
 const len=Math.hypot(x,y);
 if(len>max){x=x/len*max;y=y/len*max}
 joy.x=x/max;
 joy.y=y/max;
 stick.style.left="calc(50% + "+x+"px)";
 stick.style.top="calc(50% + "+y+"px)";
}

joystick.addEventListener("pointerdown",e=>{
 joystick.setPointerCapture(e.pointerId);
 joystickMove(e);
});
joystick.addEventListener("pointermove",e=>{
 if(joystick.hasPointerCapture(e.pointerId))
  joystickMove(e);
});
function releaseJoystick(){
 joy.x=joy.y=0;
 stick.style.left="50%";
 stick.style.top="50%";
}
joystick.addEventListener("pointerup",releaseJoystick);
joystick.addEventListener("pointercancel",releaseJoystick);

$("fire").addEventListener("pointerdown",e=>{
 e.preventDefault();
 shoot();
});
$("reload").onclick=reload;

/* MOBILE CAMERA SWIPE */

let lookPointer=null,lastX=0,lastY=0;
renderer.domElement.addEventListener("pointerdown",e=>{
 if(e.pointerType==="mouse")return;
 lookPointer=e.pointerId;
 lastX=e.clientX;lastY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener("pointermove",e=>{
 if(e.pointerId!==lookPointer)return;
 yaw-=(e.clientX-lastX)*.006;
 pitch-=(e.clientY-lastY)*.006;
 pitch=THREE.MathUtils.clamp(pitch,-1.3,1.3);
 lastX=e.clientX;lastY=e.clientY;
});
renderer.domElement.addEventListener("pointerup",()=>{
 lookPointer=null;
});

$("start").onclick=()=>{
 for(const e of enemies)scene.remove(e.group);
 enemies.length=0;
 hp=100;ammo=30;reserve=120;
 kills=0;wave=1;
 yaw=0;pitch=0;
 camera.position.set(0,1.7,10);
 playing=true;
 reloading=false;
 fireCooldown=0;
 $("menu").style.display="none";
 spawnWave();
 updateHud();
};

/* GAME LOOP */

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(playing){
  fireCooldown=Math.max(0,fireCooldown-dt);
  updatePlayer(dt);
  updateEnemies(dt);

  if(reloading){
   reloadTime-=dt;
   if(reloadTime<=0)finishReload();
  }

  gun.position.z=THREE.MathUtils.lerp(
   gun.position.z,0,dt*12
  );
  gun.rotation.x=THREE.MathUtils.lerp(
   gun.rotation.x,0,dt*12
  );

  damageFlash=Math.max(0,damageFlash-dt);
  $("damage").style.opacity=damageFlash*.5;
 }

 renderer.render(scene,camera);
}

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

updateHud();
animate();
</script>
</body>
</html>
