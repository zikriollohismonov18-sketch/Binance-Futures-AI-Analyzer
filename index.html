
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAYO Football 2026</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#081622;
 color:white;
 font-family:Arial,sans-serif;
 text-align:center;
}
header{padding:14px;background:#10283a}
h1{margin:0;font-size:24px}
small{color:#a8c4d3}
main{max-width:1000px;margin:auto;padding:12px}
.scoreboard{
 display:flex;justify-content:space-around;
 align-items:center;background:#152c40;
 border:1px solid #34536a;
 border-radius:12px;padding:12px;
 margin-bottom:10px;
}
.score{font-size:32px;font-weight:bold}
#clock{color:#ffe080;font-size:19px}
canvas{
 display:block;width:100%;
 max-width:960px;
 aspect-ratio:16/10;
 margin:auto;
 border:3px solid #e5f2ff;
 border-radius:10px;
 background:#168448;
 touch-action:none;
}
button{
 background:#2267c5;color:white;
 border:0;border-radius:10px;
 padding:13px 18px;font-size:16px;
 font-weight:bold;cursor:pointer;
 touch-action:none;
 user-select:none;
}
button:active{background:#1a9d75}
.toolbar{
 display:flex;gap:10px;justify-content:center;
 flex-wrap:wrap;margin:12px 0;
}
.controls{
 display:flex;justify-content:space-between;
 align-items:center;gap:15px;
 max-width:650px;margin:15px auto;
}
.dpad{
 display:grid;
 grid-template-columns:repeat(3,55px);
 grid-template-rows:repeat(3,50px);
 gap:5px;
}
.dpad button{padding:0;font-size:22px}
.shoot{
 background:#e63d4f;
 border-radius:50%;
 width:100px;height:100px;
 font-size:18px;
}
.pass{
 background:#e5a827;
 color:#17202a;
 border-radius:50%;
 width:75px;height:75px;
}
.actions{display:flex;align-items:center;gap:10px}
.info{color:#a8c4d3;line-height:1.6}
@media(max-width:480px){
 h1{font-size:20px}
 .score{font-size:25px}
 .dpad{grid-template-columns:repeat(3,47px);grid-template-rows:repeat(3,45px)}
 .shoot{width:83px;height:83px;font-size:15px}
 .pass{width:65px;height:65px;font-size:13px}
 .actions{gap:5px}
}
</style>
</head>
<body>

<header>
<h1>⚽ VAYO FOOTBALL 2026</h1>
<small>Mobile & Desktop Football Game</small>
</header>

<main>
<div class="scoreboard">
 <div>🔵 VAYO<div class="score" id="home">0</div></div>
 <div><div id="clock">02:00</div><small id="message">READY</small></div>
 <div>🔴 CPU<div class="score" id="away">0</div></div>
</div>

<canvas id="game" width="960" height="600"></canvas>

<div class="toolbar">
 <button onclick="startGame()">▶ START / RESTART</button>
 <button onclick="togglePause()">⏸ PAUSE</button>
 <button onclick="switchPlayer()">🔄 SWITCH</button>
</div>

<div class="controls">
 <div class="dpad">
  <span></span><button data-key="up">▲</button><span></span>
  <button data-key="left">◀</button>
  <span></span>
  <button data-key="right">▶</button>
  <span></span><button data-key="down">▼</button><span></span>
 </div>
 <div class="actions">
  <button class="pass" id="passBtn">PASS</button>
  <button class="shoot" id="shootBtn">SHOOT</button>
 </div>
</div>

<p class="info">
Компютер: WASD ё тирчаҳо — ҳаракат;
SPACE — зарба; X — пас; C — иваз кардани бозингар.
<br>
Телефон: тугмаҳои ҳаракат, PASS ва SHOOT.
</p>
</main>

<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=960,H=600;
const goalTop=240,goalBottom=360;
const keys={};
let blue=[],red=[],ball;
let selected=0;
let home=0,away=0;
let remaining=120;
let playing=false,paused=false;
let lastTime=0;
let kickCooldown=0;
let goalDelay=0;
let lastScorer="";
let aiKickCooldown=0;

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function player(x,y,team,number,keeper=false){
 return {
  x,y,homeX:x,homeY:y,
  team,number,keeper,
  r:keeper?17:16,
  speed:keeper?175:205
 };
}

function createTeams(){
 blue=[
  player(85,300,"blue",1,true),
  player(240,180,"blue",2),
  player(240,420,"blue",3),
  player(390,250,"blue",7),
  player(390,350,"blue",9)
 ];
 red=[
  player(875,300,"red",1,true),
  player(720,180,"red",2),
  player(720,420,"red",3),
  player(570,250,"red",7),
  player(570,350,"red",9)
 ];
 selected=3;
}

function resetBall(){
 ball={x:480,y:300,vx:0,vy:0,r:9};
 kickCooldown=0;
 aiKickCooldown=0;
}

function updateUI(){
 $("home").textContent=home;
 $("away").textContent=away;
 const m=Math.floor(remaining/60);
 const s=Math.floor(remaining%60);
 $("clock").textContent=
  String(m).padStart(2,"0")+":"+
  String(s).padStart(2,"0");
}

function startGame(){
 createTeams();
 resetBall();
 home=0;away=0;
 remaining=120;
 playing=true;paused=false;
 goalDelay=0;
 lastTime=performance.now();
 $("message").textContent="PLAY!";
 updateUI();
}

function togglePause(){
 if(!playing)return;
 paused=!paused;
 $("message").textContent=paused?"PAUSED":"PLAY!";
}

function switchPlayer(){
 if(!blue.length)return;
 const candidates=blue
  .map((p,i)=>({i,d:distance(p,ball)}))
  .filter(x=>!blue[x.i].keeper)
  .sort((a,b)=>a.d-b.d);

 if(!candidates.length)return;
 const nearest=candidates[0].i;
 selected=nearest===selected&&candidates.length>1
  ?candidates[1].i:nearest;
}

function moveToward(p,x,y,dt,speedFactor=1){
 const dx=x-p.x,dy=y-p.y;
 const len=Math.hypot(dx,dy);
 if(len<1)return;
 const step=Math.min(len,p.speed*speedFactor*dt);
 p.x+=dx/len*step;
 p.y+=dy/len*step;
}

function boundaries(p){
 p.x=clamp(p.x,35,W-35);
 p.y=clamp(p.y,35,H-35);
}

function inputDirection(){
 let x=0,y=0;
 if(keys.left||keys.ArrowLeft||keys.a)x--;
 if(keys.right||keys.ArrowRight||keys.d)x++;
 if(keys.up||keys.ArrowUp||keys.w)y--;
 if(keys.down||keys.ArrowDown||keys.s)y++;
 const len=Math.hypot(x,y);
 return len?{x:x/len,y:y/len}:{x:0,y:0};
}

function movePlayers(dt){
 const dir=inputDirection();
 const controlled=blue[selected];

 if(controlled){
  controlled.x+=dir.x*controlled.speed*dt;
  controlled.y+=dir.y*controlled.speed*dt;
 }

 const blueField=blue.filter(p=>!p.keeper);
 const redField=red.filter(p=>!p.keeper);

 const blueChaser=[...blueField]
  .sort((a,b)=>distance(a,ball)-distance(b,ball))[0];

 const redChaser=[...redField]
  .sort((a,b)=>distance(a,ball)-distance(b,ball))[0];

 for(const p of blue){
  if(p.keeper){
   moveToward(p,75,clamp(ball.y,goalTop+15,goalBottom-15),dt,.85);
  }else if(p!==controlled){
   if(p===blueChaser){
    moveToward(p,ball.x,ball.y,dt,.75);
   }else{
    const targetX=clamp(
     p.homeX+(ball.x-480)*.22,150,750
    );
    const targetY=clamp(
     p.homeY+(ball.y-300)*.12,70,530
    );
    moveToward(p,targetX,targetY,dt,.55);
   }
  }
  boundaries(p);
 }

 for(const p of red){
  if(p.keeper){
   moveToward(p,885,clamp(ball.y,goalTop+15,goalBottom-15),dt,.9);
  }else if(p===redChaser){
   moveToward(p,ball.x,ball.y,dt,.95);
  }else{
   const targetX=clamp(
    p.homeX+(ball.x-480)*.22,210,810
   );
   const targetY=clamp(
    p.homeY+(ball.y-300)*.12,70,530
   );
   moveToward(p,targetX,targetY,dt,.55);
  }
  boundaries(p);
 }
}

function kick(p,targetX,targetY,power){
 const dx=targetX-ball.x;
 const dy=targetY-ball.y;
 const len=Math.hypot(dx,dy)||1;
 ball.vx=dx/len*power;
 ball.vy=dy/len*power;
 ball.x=p.x+dx/len*(p.r+ball.r+2);
 ball.y=p.y+dy/len*(p.r+ball.r+2);
}

function shoot(){
 if(!playing||paused||goalDelay>0||kickCooldown>0)return;
 const p=blue[selected];
 if(distance(p,ball)>p.r+ball.r+24)return;
 kick(p,960,300+(Math.random()-.5)*80,620);
 kickCooldown=.35;
}

function pass(){
 if(!playing||paused||goalDelay>0||kickCooldown>0)return;
 const p=blue[selected];
 if(distance(p,ball)>p.r+ball.r+24)return;
 const mates=blue.filter(x=>x!==p&&!x.keeper);
 if(!mates.length)return;
 const target=mates.sort((a,b)=>
  distance(a,p)-distance(b,p)
 )[0];
 kick(p,target.x,target.y,400);
 kickCooldown=.3;
}

function collidePlayers(){
 for(const p of [...blue,...red]){
  const dx=ball.x-p.x,dy=ball.y-p.y;
  const len=Math.hypot(dx,dy)||.001;
  const min=p.r+ball.r;
  if(len<min){
   const nx=dx/len,ny=dy/len;
   ball.x=p.x+nx*min;
   ball.y=p.y+ny*min;
   const push=100;
   ball.vx+=nx*push;
   ball.vy+=ny*push;
  }
 }
}

function aiShoot(){
 if(aiKickCooldown>0)return;
 const p=red
  .filter(x=>!x.keeper)
  .sort((a,b)=>distance(a,ball)-distance(b,ball))[0];

 if(p&&distance(p,ball)<p.r+ball.r+20){
  if(ball.x<560||Math.random()<.4){
   kick(p,0,300+(Math.random()-.5)*110,490);
  }else{
   const mate=red.filter(x=>x!==p&&!x.keeper)
    .sort((a,b)=>a.x-b.x)[0];
   if(mate)kick(p,mate.x,mate.y,340);
  }
  aiKickCooldown=.7;
 }
}

function goal(team){
 if(team==="blue")home++;
 else away++;

 lastScorer=team;
 $("message").textContent=
  team==="blue"?"⚽ GOAL VAYO!":"⚽ GOAL CPU!";
 goalDelay=1.6;
 ball.vx=ball.vy=0;
 updateUI();
}

function updateBall(dt){
 ball.x+=ball.vx*dt;
 ball.y+=ball.vy*dt;

 const friction=Math.pow(.985,dt*60);
 ball.vx*=friction;
 ball.vy*=friction;

 if(ball.y-ball.r<22){
  ball.y=22+ball.r;
  ball.vy=Math.abs(ball.vy)*.75;
 }
 if(ball.y+ball.r>H-22){
  ball.y=H-22-ball.r;
  ball.vy=-Math.abs(ball.vy)*.75;
 }

 if(ball.x+ball.r>W-22){
  if(ball.y>goalTop&&ball.y<goalBottom){
   goal("blue");
   return;
  }
  ball.x=W-22-ball.r;
  ball.vx=-Math.abs(ball.vx)*.75;
 }

 if(ball.x-ball.r<22){
  if(ball.y>goalTop&&ball.y<goalBottom){
   goal("red");
   return;
  }
  ball.x=22+ball.r;
  ball.vx=Math.abs(ball.vx)*.75;
 }

 collidePlayers();
 aiShoot();
}

function update(dt){
 if(!playing||paused)return;

 if(goalDelay>0){
  goalDelay-=dt;
  if(goalDelay<=0){
   createTeams();
   resetBall();
   $("message").textContent="PLAY!";
  }
  return;
 }

 remaining=Math.max(0,remaining-dt);
 kickCooldown=Math.max(0,kickCooldown-dt);
 aiKickCooldown=Math.max(0,aiKickCooldown-dt);

 movePlayers(dt);
 updateBall(dt);
 updateUI();

 if(remaining<=0){
  playing=false;
  $("message").textContent=
   home>away?"🏆 YOU WIN!":
   away>home?"CPU WINS":"DRAW!";
 }
}

function drawPitch(){
 ctx.fillStyle="#147b42";
 ctx.fillRect(0,0,W,H);

 for(let i=0;i<10;i++){
  ctx.fillStyle=i%2?"#19894a":"#168045";
  ctx.fillRect(i*96,0,96,H);
 }

 ctx.strokeStyle="rgba(255,255,255,.85)";
 ctx.lineWidth=3;
 ctx.strokeRect(22,22,W-44,H-44);

 ctx.beginPath();
 ctx.moveTo(W/2,22);
 ctx.lineTo(W/2,H-22);
 ctx.stroke();

 ctx.beginPath();
 ctx.arc(W/2,H/2,78,0,Math.PI*2);
 ctx.stroke();

 ctx.fillStyle="white";
 ctx.beginPath();
 ctx.arc(W/2,H/2,4,0,Math.PI*2);
 ctx.fill();

 ctx.strokeRect(22,160,130,280);
 ctx.strokeRect(W-152,160,130,280);
 ctx.strokeRect(22,220,55,160);
 ctx.strokeRect(W-77,220,55,160);

 ctx.strokeStyle="#dceaff";
 ctx.strokeRect(3,goalTop,19,goalBottom-goalTop);
 ctx.strokeRect(W-22,goalTop,19,goalBottom-goalTop);

 ctx.fillStyle="white";
 ctx.beginPath();
 ctx.arc(115,300,4,0,Math.PI*2);
 ctx.arc(W-115,300,4,0,Math.PI*2);
 ctx.fill();
}

function drawPlayer(p){
 ctx.beginPath();
 ctx.fillStyle="rgba(0,0,0,.25)";
 ctx.ellipse(p.x+3,p.y+6,p.r+3,p.r*.65,0,0,Math.PI*2);
 ctx.fill();

 ctx.beginPath();
 ctx.fillStyle=p.team==="blue"?"#2785ff":"#f34856";
 ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
 ctx.fill();

 ctx.lineWidth=3;
 ctx.strokeStyle="white";
 ctx.stroke();

 ctx.fillStyle="white";
 ctx.font="bold 14px Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText(p.number,p.x,p.y);

 if(p===blue[selected]){
  ctx.strokeStyle="#ffe166";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.r+8,0,Math.PI*2);
  ctx.stroke();

  ctx.fillStyle="#ffe166";
  ctx.beginPath();
  ctx.moveTo(p.x,p.y-35);
  ctx.lineTo(p.x-8,p.y-48);
  ctx.lineTo(p.x+8,p.y-48);
  ctx.closePath();
  ctx.fill();
 }
}

function drawBall(){
 ctx.fillStyle="rgba(0,0,0,.3)";
 ctx.beginPath();
 ctx.ellipse(ball.x+3,ball.y+4,11,7,0,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="white";
 ctx.beginPath();
 ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#172536";
 ctx.beginPath();
 ctx.arc(ball.x,ball.y,4,0,Math.PI*2);
 ctx.fill();
}

function draw(){
 drawPitch();
 blue.forEach(drawPlayer);
 red.forEach(drawPlayer);
 drawBall();

 if(!playing){
  ctx.fillStyle="rgba(0,0,0,.55)";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="white";
  ctx.font="bold 40px Arial";
  ctx.textAlign="center";
  ctx.fillText(
   remaining===0?"FULL TIME":"VAYO FOOTBALL",
   W/2,H/2-15
  );
  ctx.font="23px Arial";
  ctx.fillText(
   remaining===0?`${home} - ${away}`:"PRESS START",
   W/2,H/2+32
  );
 }else if(paused){
  ctx.fillStyle="rgba(0,0,0,.45)";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="white";
  ctx.font="bold 40px Arial";
  ctx.textAlign="center";
  ctx.fillText("PAUSED",W/2,H/2);
 }
}

function loop(now){
 const dt=Math.min((now-lastTime)/1000||0,.033);
 lastTime=now;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>{
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "]
  .includes(e.key))e.preventDefault();

 keys[e.key]=true;

 if(e.repeat)return;
 if(e.code==="Space")shoot();
 if(e.key.toLowerCase()==="x")pass();
 if(e.key.toLowerCase()==="c")switchPlayer();
});

document.addEventListener("keyup",e=>{
 keys[e.key]=false;
});

document.querySelectorAll("[data-key]").forEach(btn=>{
 const key=btn.dataset.key;

 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
  btn.setPointerCapture(e.pointerId);
 });

 const release=e=>{
  keys[key]=false;
 };
 btn.addEventListener("pointerup",release);
 btn.addEventListener("pointercancel",release);
 btn.addEventListener("lostpointercapture",release);
});

$("shootBtn").addEventListener("pointerdown",e=>{
 e.preventDefault();shoot();
});
$("passBtn").addEventListener("pointerdown",e=>{
 e.preventDefault();pass();
});

createTeams();
resetBall();
updateUI();
requestAnimationFrame(loop);
</script>
</body>
</html>
