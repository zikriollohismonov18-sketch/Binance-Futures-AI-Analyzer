
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAYO KIDS — Learn English</title>
<style>
:root{
 --pink:#ff7bac;
 --purple:#7654d9;
 --blue:#59b9f5;
 --yellow:#ffe584;
}
*{box-sizing:border-box}
body{
 margin:0;font-family:"Trebuchet MS",Arial,sans-serif;
 background:linear-gradient(145deg,#fff4cc,#fce3fa,#dff5ff);
 color:#453b68;min-height:100vh;
}
header{
 text-align:center;padding:22px 12px;
 background:#ffffffa8;border-bottom:4px solid #fff;
}
h1{margin:0;font-size:clamp(27px,6vw,42px);color:#ed5d98}
.subtitle{font-size:16px;margin-top:7px}
main{max-width:1050px;margin:auto;padding:15px}
.hero{
 background:white;border-radius:30px;
 padding:20px;display:flex;align-items:center;
 justify-content:center;gap:25px;flex-wrap:wrap;
 box-shadow:0 8px 25px #8b6ca326;
}
.bear{
 font-size:105px;cursor:pointer;
 animation:bounce 2.5s infinite;
 user-select:none;
}
.bear.talking{animation:talk .28s infinite alternate}
@keyframes bounce{
 0%,100%{transform:translateY(0) rotate(-4deg)}
 50%{transform:translateY(-12px) rotate(4deg)}
}
@keyframes talk{
 from{transform:scale(1) rotate(-6deg)}
 to{transform:scale(1.12) rotate(6deg)}
}
.speech{
 background:#f1eaff;padding:18px;
 border-radius:22px;max-width:440px;
 text-align:center;
}
.speech h2{margin:4px;color:#7048c5}
button{
 border:0;cursor:pointer;border-radius:20px;
 padding:13px 20px;font-size:17px;
 font-weight:bold;touch-action:manipulation;
}
.speakBtn{background:var(--purple);color:white}
.categories{
 display:flex;gap:9px;overflow-x:auto;
 padding:17px 0;scrollbar-width:thin;
}
.category{
 background:white;color:#5b4787;
 border:3px solid transparent;white-space:nowrap;
}
.category.active{
 background:#7654d9;color:white;border-color:#c8b6ff;
}
.sectionTitle{text-align:center;font-size:25px;margin:8px}
.grid{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:15px;margin:18px 0;
}
.card{
 background:white;border-radius:25px;
 min-height:185px;padding:15px;
 text-align:center;box-shadow:0 6px 0 #e4d7f3;
 border:3px solid #fff;cursor:pointer;
 transition:transform .15s;
}
.card:active{transform:scale(.95)}
.card.selected{border-color:#ff84bd;background:#fff4fa}
.picture{
 font-size:clamp(65px,9vw,95px);
 line-height:1.35;display:block;
}
.english{font-size:24px;font-weight:bold;color:#6550bf}
.tajik{font-size:15px;color:#84799b;margin-top:5px}
.soundIcon{font-size:19px;margin-top:9px}
.lesson{
 background:white;border-radius:28px;
 padding:22px;text-align:center;margin:25px 0;
}
.lesson button{background:#ffcc4d;color:#4b3b24}
#quizChoices{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:12px;margin-top:20px;
}
.quizOption{
 background:#f4edff;font-size:65px;
 border:3px solid transparent;
 min-height:125px;
}
.quizOption.correct{background:#d7ffe0;border-color:#44bf70}
.quizOption.wrong{background:#ffe3e3;border-color:#f27d7d}
#quizWord{font-size:27px;color:#7053cc;font-weight:bold}
footer{text-align:center;padding:20px;color:#83769c}
@media(max-width:650px){
 .grid{grid-template-columns:repeat(2,1fr);gap:10px}
 .card{min-height:150px;padding:10px}
 .picture{font-size:65px}
 .english{font-size:20px}
 .hero{gap:5px}
 .bear{font-size:90px}
 .speech{padding:12px}
 .quizOption{font-size:48px;min-height:95px}
}
</style>
</head>
<body>

<header>
<h1>🌈 VAYO KIDS 🧸</h1>
<div class="subtitle">English Adventure — Барои кӯдакони 3+</div>
</header>

<main>

<section class="hero">
 <div id="bear" class="bear" role="button"
      tabindex="0" aria-label="Хирсча">🧸</div>
 <div class="speech">
  <h2 id="heroEnglish">Hello, my friend! 👋</h2>
  <p id="heroTajik">Салом, дӯсти ман!</p>
  <button class="speakBtn" id="repeatBtn">🔊 Гӯш кун!</button>
 </div>
</section>

<nav class="categories" id="categories"></nav>

<h2 class="sectionTitle" id="categoryTitle">👋 Greetings</h2>
<div class="grid" id="cards"></div>

<section class="lesson">
 <h2>⭐ Бозии омӯзишӣ</h2>
 <p>Калимаро гӯш кун ва расми дурустро интихоб намо!</p>
 <button id="newQuiz">🎲 Бозии нав</button>
 <p id="quizWord">Ready?</p>
 <div id="quizChoices"></div>
 <h3 id="quizResult"></h3>
 <p>⭐ Ситорачаҳо: <strong id="stars">0</strong></p>
</section>

</main>
<footer>💖 VAYO KIDS — Learn, Play & Smile</footer>

<script>
"use strict";

const lessons={
 greetings:{
  title:"👋 Greetings — Салом",
  items:[
   ["👋","Hello","Салом"],
   ["😊","Hi","Салом"],
   ["👋","Bye-bye","Хайр"],
   ["🙏","Thank you","Раҳмат"],
   ["❤️","I love you","Ман туро дӯст медорам"],
   ["🌞","Good morning","Субҳ ба хайр"],
   ["🌙","Good night","Шаб ба хайр"],
   ["😃","Happy","Хурсанд"],
   ["😴","Sleepy","Хоболуд"]
  ]
 },
 animals:{
  title:"🐶 Animals — Ҳайвонот",
  items:[
   ["🐱","Cat","Гурба"],
   ["🐶","Dog","Саг"],
   ["🐰","Rabbit","Харгӯш"],
   ["🐻","Bear","Хирс"],
   ["🦁","Lion","Шер"],
   ["🐯","Tiger","Паланг"],
   ["🐘","Elephant","Фил"],
   ["🐒","Monkey","Маймун"],
   ["🐼","Panda","Панда"],
   ["🐮","Cow","Гов"],
   ["🐑","Sheep","Гӯсфанд"],
   ["🐴","Horse","Асп"],
   ["🐥","Chick","Чӯҷа"],
   ["🦆","Duck","Мурғобӣ"],
   ["🐟","Fish","Моҳӣ"]
  ]
 },
 fruits:{
  title:"🍎 Fruits — Меваҳо",
  items:[
   ["🍎","Apple","Себ"],
   ["🍌","Banana","Банан"],
   ["🍊","Orange","Афлесун"],
   ["🍓","Strawberry","Қулфинай"],
   ["🍇","Grapes","Ангур"],
   ["🍉","Watermelon","Тарбуз"],
   ["🍐","Pear","Нок"],
   ["🍒","Cherry","Гелос"],
   ["🍍","Pineapple","Ананас"],
   ["🥭","Mango","Манго"],
   ["🥝","Kiwi","Киви"],
   ["🍑","Peach","Шафтолу"]
  ]
 },
 colors:{
  title:"🎨 Colors — Рангҳо",
  items:[
   ["🔴","Red","Сурх"],
   ["🔵","Blue","Кабуд"],
   ["🟢","Green","Сабз"],
   ["🟡","Yellow","Зард"],
   ["🟠","Orange","Норанҷӣ"],
   ["🟣","Purple","Бунафш"],
   ["⚫","Black","Сиёҳ"],
   ["⚪","White","Сафед"],
   ["🩷","Pink","Гулобӣ"],
   ["🟤","Brown","Қаҳваранг"]
  ]
 },
 numbers:{
  title:"🔢 Numbers — Рақамҳо",
  items:[
   ["1️⃣","One","Як"],
   ["2️⃣","Two","Ду"],
   ["3️⃣","Three","Се"],
   ["4️⃣","Four","Чор"],
   ["5️⃣","Five","Панҷ"],
   ["6️⃣","Six","Шаш"],
   ["7️⃣","Seven","Ҳафт"],
   ["8️⃣","Eight","Ҳашт"],
   ["9️⃣","Nine","Нӯҳ"],
   ["🔟","Ten","Даҳ"]
  ]
 },
 body:{
  title:"👀 Body — Бадан",
  items:[
   ["👀","Eyes","Чашмҳо"],
   ["👂","Ear","Гӯш"],
   ["👃","Nose","Бинӣ"],
   ["👄","Mouth","Даҳон"],
   ["✋","Hand","Даст"],
   ["🦶","Foot","Пой"],
   ["🦷","Tooth","Дандон"],
   ["👅","Tongue","Забон"],
   ["💪","Arm","Даст"],
   ["🦵","Leg","Пой"]
  ]
 },
 things:{
  title:"🏠 Things — Ашё",
  items:[
   ["🚗","Car","Мошин"],
   ["🏠","House","Хона"],
   ["⚽","Ball","Тӯб"],
   ["📚","Book","Китоб"],
   ["🧸","Teddy bear","Хирсча"],
   ["🪑","Chair","Курсӣ"],
   ["🛏️","Bed","Кат"],
   ["🚲","Bicycle","Дучарха"],
   ["🚌","Bus","Автобус"],
   ["✈️","Airplane","Ҳавопаймо"],
   ["🚂","Train","Қатора"],
   ["🚀","Rocket","Мушак"]
  ]
 },
 food:{
  title:"🥛 Food — Хӯрок",
  items:[
   ["🥛","Milk","Шир"],
   ["💧","Water","Об"],
   ["🍞","Bread","Нон"],
   ["🥚","Egg","Тухм"],
   ["🧀","Cheese","Панир"],
   ["🍚","Rice","Биринҷ"],
   ["🍯","Honey","Асал"],
   ["🍪","Cookie","Кулча"],
   ["🥕","Carrot","Сабзӣ"],
   ["🥔","Potato","Картошка"],
   ["🍅","Tomato","Помидор"],
   ["🥒","Cucumber","Бодиринг"]
  ]
 }
};

let current="greetings";
let lastItem=lessons.greetings.items[0];
let quizAnswer=null;
let stars=0;
let speaking=false;
let speakingTimeout=null;

const $=id=>document.getElementById(id);

function setBearTalking(value){
 $("bear").classList.toggle("talking",value);
 speaking=value;
}

function englishVoice(){
 const voices=window.speechSynthesis?.getVoices()||[];
 return voices.find(v=>v.lang.toLowerCase()==="en-us")
  ||voices.find(v=>v.lang.toLowerCase().startsWith("en"))
  ||null;
}

function speak(text,callback){
 if(!("speechSynthesis" in window)){
  $("heroTajik").textContent=
   "Ин браузер овозхониро дастгирӣ намекунад.";
  return;
 }

 speechSynthesis.cancel();
 clearTimeout(speakingTimeout);

 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="en-US";
 utterance.rate=.76;
 utterance.pitch=1.18;
 utterance.volume=1;

 const voice=englishVoice();
 if(voice)utterance.voice=voice;

 utterance.onstart=()=>setBearTalking(true);
 utterance.onend=()=>{
  setBearTalking(false);
  if(callback)callback();
 };
 utterance.onerror=()=>setBearTalking(false);

 speechSynthesis.speak(utterance);
}

function chooseItem(item){
 lastItem=item;
 $("heroEnglish").textContent=item[1];
 $("heroTajik").textContent=item[2];
 speak(item[1]);

 document.querySelectorAll(".card").forEach(c=>{
  c.classList.toggle(
   "selected",c.dataset.word===item[1]
  );
 });
}

function renderCategories(){
 const nav=$("categories");
 nav.innerHTML="";

 for(const [key,lesson] of Object.entries(lessons)){
  const btn=document.createElement("button");
  btn.className="category"+(key===current?" active":"");
  btn.textContent=lesson.title.split(" — ")[0];
  btn.onclick=()=>{
   current=key;
   renderCategories();
   renderCards();
   chooseItem(lessons[current].items[0]);
   $("quizChoices").innerHTML="";
   $("quizWord").textContent="Ready?";
   $("quizResult").textContent="";
  };
  nav.appendChild(btn);
 }
}

function renderCards(){
 const lesson=lessons[current];
 $("categoryTitle").textContent=lesson.title;
 const grid=$("cards");
 grid.innerHTML="";

 for(const item of lesson.items){
  const card=document.createElement("div");
  card.className="card";
  card.dataset.word=item[1];
  card.setAttribute("role","button");
  card.tabIndex=0;

  const picture=document.createElement("span");
  picture.className="picture";
  picture.textContent=item[0];

  const en=document.createElement("div");
  en.className="english";
  en.textContent=item[1];

  const tg=document.createElement("div");
  tg.className="tajik";
  tg.textContent=item[2];

  const sound=document.createElement("div");
  sound.className="soundIcon";
  sound.textContent="🔊";

  card.append(picture,en,tg,sound);
  card.onclick=()=>chooseItem(item);
  card.onkeydown=e=>{
   if(e.key==="Enter"||e.key===" "){
    e.preventDefault();
    chooseItem(item);
   }
  };
  grid.appendChild(card);
 }
}

function shuffle(array){
 const a=[...array];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function newQuiz(){
 const items=lessons[current].items;
 const options=shuffle(items).slice(0,3);
 quizAnswer=options[Math.floor(Math.random()*options.length)];

 $("quizWord").textContent="Find: "+quizAnswer[1];
 $("quizResult").textContent="";
 const area=$("quizChoices");
 area.innerHTML="";

 options.forEach(item=>{
  const btn=document.createElement("button");
  btn.className="quizOption";
  btn.textContent=item[0];
  btn.setAttribute("aria-label",item[1]);

  btn.onclick=()=>{
   if(!quizAnswer)return;

   if(item===quizAnswer){
    btn.classList.add("correct");
    $("quizResult").textContent="🌟 Excellent! Very good!";
    stars++;
    $("stars").textContent=stars;
    speak("Excellent! "+item[1]);
    quizAnswer=null;
   }else{
    btn.classList.add("wrong");
    $("quizResult").textContent="😊 Try again!";
    speak("Try again");
   }
  };

  area.appendChild(btn);
 });

 speak("Find "+quizAnswer[1]);
}

$("repeatBtn").onclick=()=>speak(lastItem[1]);
$("bear").onclick=()=>speak("Hello, my friend!");
$("bear").onkeydown=e=>{
 if(e.key==="Enter"||e.key===" "){
  e.preventDefault();
  speak("Hello, my friend!");
 }
};
$("newQuiz").onclick=newQuiz;

renderCategories();
renderCards();

if("speechSynthesis" in window){
 speechSynthesis.getVoices();
 speechSynthesis.onvoiceschanged=()=>englishVoice();
}
</script>
</body>
</html>
